services:
  api:
    image: sochub/api
    ports:
      - "3000"
    networks:
      - api-tier
  db:
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - "5432"
    networks:
      - db-tier
    environment: 
      POSTGRES_PASSWORD: admin
networks:
  api-tier: {}
  db-tier: {}
